<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standby - Homologações - PremCell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/cards.css">
<script src="/js/auth.js"></script>
</head>
<body>
<aside class="sb" id="sidebar" aria-label="Menu principal">
  <div class="sb-top">
    <div class="sb-brandrow">
      <img class="sb-logo" src="/img/logo_branco.png" alt="PremCell">
      <button type="button" class="sb-toggle" id="sbToggle" aria-label="Recolher menu" aria-expanded="true" aria-controls="sidebar">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </div>
    <h1 class="sb-title">Homologações Reprovadas</h1>
    <p class="desc">Equipes que a diretoria decidiu não homologar. Ficam fora do prazo (SLA) e do fluxo normal.</p>
  </div>
  <div class="sb-nav">
    <p class="sb-cap">Navegação</p>
    <nav id="navPrincipal" aria-label="Páginas"></nav>
  </div>
  <div class="sb-foot">
    <div class="sb-acts acts">
      <button type="button" class="ghost" data-tip="Atualizar" onclick="carregar()">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span class="sb-label">Atualizar</span>
      </button>
    </div>
  </div>
</aside>
<div class="sb-overlay" id="sbOverlay"></div>
<script src="/js/nav.js"></script>
<div class="app-main">
  <div class="mbar">
    <button type="button" id="sbOpen" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="mbar-title">Análise de homologações</span>
  </div>
  <main><div id="app" aria-live="polite"></div></main>
</div>
<script src="/js/nav.js"></script>
<main><div id="app" aria-live="polite"></div></main>
<script src="/js/diretoria-comum.js"></script>
<script src="/js/sidebar.js"></script>
<script>
async function carregar() {
  const token = tokenAdm();
  if (!token) { el('app').innerHTML = '<div class="card"><p class="msg">Sessão sem token. Entre novamente.</p></div>'; return; }
  el('app').innerHTML = '<div class="card"><p class="msg"><span class="spin"></span>Carregando...</p></div>';

  const erros = [];
  const [casos, pedidos] = await Promise.all([
    vdRpc('diretoria_listar', { p_token: token, p_status: 'STANDBY' }).then(r => r || []).catch(e => { erros.push(e.message); return []; }),
    vdRpc('diretoria_pedidos_standby', { p_token: token }).then(r => r || []).catch(e => { erros.push(e.message); return []; })
  ]);

  const cardCaso = h => `<div class="ccard pend">
    <div class="nm">${esc(h.nome)}</div>
    ${blocoCaso(h)}
    <div class="motivo" style="margin-top:8px"><b>Decisão da diretoria (${esc(fmtTs(h.decidido_em))}):</b> ${esc(h.motivo_decisao || 'sem motivo registrado')}</div>
  </div>`;

  const cardPedido = p => {
    const apt = (v) => v ? 'Apto' : 'Não apto';
    return `<div class="ccard pend">
      <div class="nm">${esc(p.equipe)}${p.recurso ? ' — ' + esc(p.recurso) : ''}</div>
      <div class="motivo" style="margin-top:6px"><b>Aptidão:</b> trabalhista: ${apt(p.apt_trabalhista)} · técnica: ${apt(p.apt_tecnico)} · patrimonial: ${apt(p.apt_patrimonial)}</div>
      ${p.apt_motivo ? `<div class="motivo" style="margin-top:6px"><b>Motivo da inaptidão:</b> ${esc(p.apt_motivo)}</div>` : ''}
      ${p.apt_anexo ? `<div style="margin-top:6px"><a href="${esc(p.apt_anexo)}" target="_blank" rel="noopener">Ver anexo</a></div>` : ''}
      <div class="motivo" style="margin-top:8px"><b>Decisão da diretoria (${esc(fmtTs(p.decidido_em))}):</b> ${esc(p.diretoria_motivo || 'sem motivo registrado')}</div>
    </div>`;
  };

  const total = casos.length + pedidos.length;
  el('app').innerHTML = `<div class="card"><div class="chead"><h2>Reprovados (${total})</h2></div>
    ${erros.length ? `<p class="msg" style="color:var(--nok)">⚠ ${esc(erros.join(' | '))}</p>` : ''}
    ${total ? `<div class="cgrid">${pedidos.map(cardPedido).join('')}${casos.map(cardCaso).join('')}</div>`
            : '<p class="msg">Nenhuma equipe em standby.</p>'}</div>`;
}
carregar();
</script>
</body>
</html>
