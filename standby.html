<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standby - Homologações - PremCell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/cards.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
<script src="/js/auth.js"></script>
</head>
<body>
<aside class="sb" id="sidebar" aria-label="Menu principal">
  <div class="sb-top">
    <div class="sb-brandrow">
      <img class="sb-logo" src="/img/logo_branco.png" alt="PremCell">
      <button type="button" class="sb-toggle" id="sbToggle" aria-label="Recolher menu" aria-expanded="true" aria-controls="sidebar">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </div>
    <h1 class="sb-title">Homologações Reprovadas</h1>
    <p class="desc">Equipes que a diretoria decidiu não homologar. Ficam fora do prazo (SLA) e do fluxo normal.</p>
  </div>
  <div class="sb-nav">
    <p class="sb-cap">Navegação</p>
    <nav id="navPrincipal" aria-label="Páginas"></nav>
  </div>
  <div class="sb-foot">
    <div class="sb-acts acts">
      <button type="button" class="ghost" data-tip="Atualizar" onclick="carregar()">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span class="sb-label">Atualizar</span>
      </button>
    </div>
  </div>
</aside>
<div class="sb-overlay" id="sbOverlay"></div>
<script src="/js/nav.js"></script>
<div class="app-main">
  <div class="mbar">
    <button type="button" id="sbOpen" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="mbar-title">Análise de homologações</span>
  </div>
  <main><div id="app" aria-live="polite"></div></main>
</div>
<script src="/js/nav.js"></script>
<main><div id="app" aria-live="polite"></div></main>
<script src="/js/diretoria-comum.js"></script>
<script src="/js/sidebar.js"></script>
<script>
let GRID = null;
function destruirGrid() { if (GRID) { GRID.destroy(); GRID = null; } }

const pillsApt = arr => arr.map(([t, ok]) => `<span class="pill ${ok === false ? 'nok' : 'ok'}">${t}</span>`).join(' ');

async function carregar() {
  const token = tokenAdm();
  destruirGrid();
  if (!token) { el('app').innerHTML = '<div class="card"><p class="msg">Sessão sem token. Entre novamente.</p></div>'; return; }
  el('app').innerHTML = '<div class="card"><p class="msg"><span class="spin"></span>Carregando...</p></div>';

  const erros = [];
  const [casos, pedidos] = await Promise.all([
    vdRpc('diretoria_listar', { p_token: token, p_status: 'STANDBY' }).then(r => r || []).catch(e => { erros.push(e.message); return []; }),
    vdRpc('diretoria_pedidos_standby', { p_token: token }).then(r => r || []).catch(e => { erros.push(e.message); return []; })
  ]);

  const linhas = [
    ...pedidos.map(p => ({
      nome: '👥 ' + p.equipe, sub: p.recurso ? 'Recurso: ' + p.recurso : '',
      apt: [['Trab.', p.apt_trabalhista], ['Téc.', p.apt_tecnico], ['Patr.', p.apt_patrimonial]],
      motivoApt: p.apt_motivo, anexo: p.apt_anexo,
      motivoDec: p.diretoria_motivo || 'sem motivo registrado', em: p.decidido_em
    })),
    ...casos.map(h => ({
      nome: h.nome, sub: 'CPF ' + fmtCpf(h.cpf),
      apt: [['Trab.', h.apto_trabalhista], ['Téc.', h.apto_tecnico], ['Patr.', h.apto_patrimonial]],
      motivoApt: h.motivo_inapto, anexo: '',
      motivoDec: h.motivo_decisao || 'sem motivo registrado', em: h.decidido_em
    }))
  ];

  el('app').innerHTML = `<div class="card"><div class="chead"><h2>Reprovados (${linhas.length})</h2></div>
    ${erros.length ? `<p class="msg" style="color:var(--nok)">⚠ ${esc(erros.join(' | '))}</p>` : ''}
    ${linhas.length
      ? '<div id="gridStandby" class="ag-theme-quartz vd-grid" style="height:min(70vh,720px)"></div>'
      : '<p class="msg">Nenhuma equipe em standby.</p>'}</div>`;

  if (!linhas.length) return;

  GRID = agGrid.createGrid(el('gridStandby'), {
    columnDefs: [
      { headerName: 'Equipe / Técnico', field: 'nome', flex: 1.2, minWidth: 220, autoHeight: true,
        valueGetter: p => p.data.nome + ' ' + p.data.sub,
        cellRenderer: p => `<div class="vg-nome" style="padding:8px 0"><b>${esc(p.data.nome)}</b>${p.data.sub ? `<div class="evid">${esc(p.data.sub)}</div>` : ''}</div>` },
      { headerName: 'Aptidão', flex: 1.4, minWidth: 240, autoHeight: true, wrapText: true, sortable: false, filter: false,
        cellRenderer: p => `<div style="padding:8px 0">${pillsApt(p.data.apt)}
          ${p.data.motivoApt ? `<div class="evid">${esc(p.data.motivoApt)}</div>` : ''}
          ${p.data.anexo ? `<div class="evid"><a href="${esc(p.data.anexo)}" target="_blank" rel="noopener">Ver anexo</a></div>` : ''}</div>` },
      { headerName: 'Decisão da diretoria', field: 'motivoDec', flex: 1.6, minWidth: 260, autoHeight: true, wrapText: true,
        cellRenderer: p => `<div style="padding:8px 0">${esc(p.value)}</div>` },
      { headerName: 'Decidido em', width: 170, sort: 'desc',
        valueGetter: p => Date.parse(p.data.em) || 0,
        valueFormatter: p => fmtTs(p.data.em) }
    ],
    rowData: linhas,
    defaultColDef: { sortable: true, resizable: true, filter: true, suppressMovable: true },
    suppressCellFocus: true,
    pagination: linhas.length > 25,
    paginationPageSize: 25,
    localeText: {
      noRowsToShow: 'Nada para mostrar', page: 'Página', of: 'de', to: 'a', more: 'mais',
      next: 'Próxima', previous: 'Anterior', first: 'Primeira', last: 'Última',
      filterOoo: 'Filtrar...', contains: 'Contém', notContains: 'Não contém', equals: 'Igual',
      notEqual: 'Diferente', startsWith: 'Começa com', endsWith: 'Termina com',
      greaterThan: 'Maior que', lessThan: 'Menor que', inRange: 'Entre',
      andCondition: 'E', orCondition: 'OU', applyFilter: 'Aplicar', resetFilter: 'Limpar', clearFilter: 'Limpar'
    }
  });
}
carregar();
</script>
</body>
</html>
