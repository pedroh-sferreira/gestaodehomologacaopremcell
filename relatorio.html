<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório Regional - PremCell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .rr{--azul:#2563eb;--indigo:#6366f1;--teal:#0d9488;--ok:#16a34a;--pend:#f59e0b;--nok:#dc2626;
      --txt:#0f172a;--sub:#64748b;--linha:#e2e8f0;--fundo:#f8fafc;--card:#fff;
      display:flex;flex-direction:column;gap:18px;font-family:'Inter',system-ui,sans-serif;color:var(--txt)}
  .rr *{box-sizing:border-box}
  .rr-card{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .rr-titulo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px}
  .rr-titulo h2{margin:0;font-size:15px;font-weight:700}
  .rr-titulo span{font-size:12px;color:var(--sub)}
  .rr-msg{margin:0;font-size:13px;color:var(--sub)}
  .rr-aviso{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 14px;font-size:13px}
  .rr-diag{font-size:11px;color:var(--sub);margin:-6px 0 0}

  .rr-filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
  .rr-filtros label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
  .rr-filtros select,.rr-filtros input{width:100%;height:38px;padding:0 10px;border:1px solid var(--linha);border-radius:9px;font:inherit;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--txt);background:#fff}
  .rr-filtros select:focus,.rr-filtros input:focus{outline:2px solid #bfdbfe;border-color:var(--azul)}
  .rr-btn{height:38px;padding:0 14px;border:1px solid var(--linha);background:#fff;border-radius:9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt)}
  .rr-btn:hover{background:var(--fundo)}
  .rr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .rr-chip{display:inline-flex;align-items:center;gap:6px;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;border:0}
  .rr-chip:hover{background:#dbeafe}

  .rr-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .rr-kpi{position:relative;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:16px 16px 14px;overflow:hidden}
  .rr-kpi::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--cor,var(--azul))}
  .rr-kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
  .rr-kpi b{display:block;margin-top:6px;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .rr-kpi em{display:block;margin-top:4px;font-style:normal;font-size:12px;color:var(--sub)}

  .rr-regionais{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .rr-reg{border:1px solid var(--linha);border-radius:12px;padding:14px;background:var(--fundo);cursor:pointer;text-align:left;font:inherit;color:inherit}
  .rr-reg:hover{border-color:#93c5fd;background:#fff}
  .rr-reg.ativa{border-color:var(--azul);background:#eff6ff}
  .rr-reg h3{margin:0;font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
  .rr-reg .ufs{margin:2px 0 10px;font-size:11px;color:var(--sub)}
  .rr-reg .valor{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .rr-reg .trilho{height:6px;border-radius:99px;background:var(--linha);margin:8px 0;overflow:hidden}
  .rr-reg .trilho i{display:block;height:100%;background:var(--azul);border-radius:99px}
  .rr-reg .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
  .rr-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
  .rr-pill{background:#fff;border:1px solid var(--linha);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;color:#334155}

  .rr-graficos{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
  .rr-barra{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
  .rr-barra .rot{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .rr-barra .trilho{height:10px;border-radius:99px;background:#eef2f7;overflow:hidden}
  .rr-barra .trilho i{display:block;height:100%;border-radius:99px;background:var(--cor,var(--azul))}
  .rr-barra .val{font-weight:700;font-variant-numeric:tabular-nums}
  .rr-donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .rr-donut .anel{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
  .rr-donut .anel::after{content:attr(data-centro);position:absolute;inset:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;text-align:center;padding:6px}
  .rr-legenda{display:flex;flex-direction:column;gap:8px;font-size:13px;flex:1;min-width:150px}
  .rr-legenda div{display:flex;align-items:center;gap:8px}
  .rr-legenda i{width:10px;height:10px;border-radius:3px;flex:none}
  .rr-legenda b{margin-left:auto;font-variant-numeric:tabular-nums}

  .rr-tabela{overflow:auto;max-height:560px;border:1px solid var(--linha);border-radius:10px}
  .rr-tabela table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  .rr-tabela th{position:sticky;top:0;background:var(--fundo);text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);padding:10px 12px;border-bottom:1px solid var(--linha);cursor:pointer;user-select:none;white-space:nowrap}
  .rr-tabela td{padding:10px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
  .rr-tabela tbody tr:hover{background:#f8fafc}
  .rr-tabela .num{text-align:right;font-variant-numeric:tabular-nums}
  .rr-tabela tfoot td{position:sticky;bottom:0;background:var(--fundo);font-weight:800;border-top:1px solid var(--linha);border-bottom:0}
  .rr-st{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
  .rr-st.ok{background:#dcfce7;color:#166534}.rr-st.pend{background:#fef3c7;color:#92400e}.rr-st.nok{background:#fee2e2;color:#991b1b}
  .rr-mais{display:flex;justify-content:center;margin-top:12px}

  @media(max-width:600px){.rr-graficos{grid-template-columns:1fr}.rr-kpi b{font-size:20px}}
</style>
<script src="/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-adapter.js"></script>
</head>
<body>
<aside class="sb" id="sidebar" aria-label="Menu principal">
  <div class="sb-top">
    <div class="sb-brandrow">
      <img class="sb-logo" src="/img/logo_branco.png" alt="PremCell">
      <button type="button" class="sb-toggle" id="sbToggle" aria-label="Recolher menu" aria-expanded="true" aria-controls="sidebar">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </div>
    <h1 class="sb-title">Relatório Regional</h1>
    <p class="desc">Valores por regional, estado, gerente, equipe e tipo de documento, com o status de aprovação do gerente.</p>
  </div>
  <div class="sb-nav">
    <p class="sb-cap">Navegação</p>
    <nav id="navPrincipal" aria-label="Páginas"></nav>
  </div>
  <div class="sb-foot">
    <div class="sb-acts acts">
      <button type="button" class="ghost" data-tip="Atualizar" onclick="carregarRelatorio()">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span class="sb-label">Atualizar</span>
      </button>
    </div>
  </div>
</aside>
<div class="sb-overlay" id="sbOverlay"></div>
<div class="app-main">
  <div class="mbar">
    <button type="button" id="sbOpen" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="mbar-title">Relatório Regional</span>
  </div>
  <main>
    <div id="app" aria-live="polite"></div>
  </main>
</div>
<script src="/js/nav.js"></script>
<script src="/js/relatorio.js"></script>
<script src="/js/sidebar.js"></script>
</body>
</html>
