<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validação de Documentação - PremCell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/cards.css">
<script>
  (function () {
    try {
      var s = localStorage.getItem('premcell.sidebar.collapsed');
      var col = s === null ? window.matchMedia('(max-width:1024px)').matches : s === '1';
      if (col) document.documentElement.classList.add('sb-collapsed');
    } catch (e) {}
  })();
</script>
<script src="/js/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-adapter.js"></script>
</head>
<body>
<aside id="sidebar" class="sb" aria-label="Navegação principal">

  <div class="sb-top">
    <div class="sb-brandrow">
      <!-- Logo original 734×340 (mesmo arquivo usado antes via --logo-url) -->
      <img class="sb-logo" src="/img/logo_branco.png" width="734" height="340" alt="PremCell">
      <button type="button" id="sbToggle" class="sb-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="Recolher menu" title="Recolher menu">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </div>
    <h1 class="sb-title">Validação de Documentação</h1>
    <p class="desc">Envio, análise e acompanhamento da documentação dos colaboradores.</p>
  </div>

  <div class="sb-nav">
    <p class="sb-cap">Navegação</p>
    <nav id="navPrincipal" aria-label="Páginas"></nav>
    <script src="/js/nav.js"></script>
  </div>

  <div class="sb-foot">
    <div class="acts sb-acts">
      <button type="button" class="primary" onclick="dispararHomologacao()" data-tip="Disparar homologação">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
        <span class="sb-label">Disparar homologação</span>
      </button>
      <button type="button" class="ghost" onclick="abrirHomologacoes()" data-tip="Homologações">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="sb-label">Homologações</span>
      </button>
      <button type="button" class="ghost" onclick="carregarHist()" data-tip="Atualizar histórico">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
        <span class="sb-label">Atualizar histórico</span>
      </button>
    </div>
  </div>
</aside>

<!-- Overlay escuro do menu no celular -->
<div id="sbOverlay" class="sb-overlay" aria-hidden="true"></div>

<div class="app-main">
  <!-- Barra compacta: aparece só no celular (hambúrguer + nome da página) -->
  <div class="mbar">
    <button type="button" id="sbOpen" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="mbar-title">Validação de Documentação</span>
  </div>

  <main>
    <div id="app" aria-live="polite"></div>
  </main>
</div>

<div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modalTit" onclick="if(event.target===this)fecharModal()">
  <div class="box">
    <div class="bar2">
      <span id="modalTit"></span>
      <button type="button" class="ghost" onclick="fecharModal()">Fechar</button>
    </div>
    <div id="modalBody" style="display:flex;flex:1;min-height:0"></div>
  </div>
</div>
<script src="/js/sugestao.js"></script>
<script src="/js/validador.js"></script>
<script src="/js/homologacao.js"></script>
<script src="/js/homologacao-aptidao.js"></script>
<script src="/js/homologacao-regional.js"></script>
<script src="/js/sidebar.js"></script>

<script>
  document.addEventListener('keydown', function (e) {
    var m = document.getElementById('modal');
    if (e.key === 'Escape' && m && !m.classList.contains('hidden') && typeof fecharModal === 'function') fecharModal();
  });
</script>
</body>
</html>
